name: CI

on:
  push:
  pull_request:

env:
  # spa.traineddata fijado (SPEC §2.1): tessdata_fast, commit y SHA-256.
  TESSDATA_URL: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/923915d4ced2a7235221788285785a29c4a42d4a/spa.traineddata
  TESSDATA_SHA256: 6f2e04d02774a18f01bed44b1111f2cd7f3ba7ac9dc4373cd3f898a40ea6b464

jobs:
  dotnet:
    name: .NET (build, tests y cobertura)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Reclamos.sln

      - name: Tests (sin integración)
        run: >
          dotnet test --solution Reclamos.sln --no-build --report-trx
          --results-directory "${{ github.workspace }}/TestResults"
          --filter-not-trait "Categoria=Integracion" --filter-not-trait "Categoria=AjusteOcr"
          --filter-not-trait "Categoria=IntegracionRag" --filter-not-trait "Categoria=CalibracionRag"

      - name: Publicar pruebas fallidas como anotaciones
        if: failure()
        run: python3 .github/scripts/trx_anotaciones.py TestResults

      - name: Cobertura de Reclamos.Guardrails
        run: >
          dotnet test --project tests/Reclamos.Guardrails.Tests --no-build
          --coverage --coverage-output-format cobertura --coverage-output guardrails.cobertura.xml
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Exigir 100 % de líneas y ramas en Reclamos.Guardrails
        run: python3 .github/scripts/cobertura.py TestResults Reclamos.Guardrails

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          path: TestResults

  ocr:
    name: OCR (integración con Tesseract)
    runs-on: ubuntu-24.04
    env:
      TESSDATA_DIR: ${{ github.workspace }}/.tessdata
      OCR_REPORTES_DIR: ${{ github.workspace }}/TestResults/ocr
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tesseract y modelo fijado
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr unixodbc
          tesseract --version
          mkdir -p "$TESSDATA_DIR"
          curl -sSfL -o "$TESSDATA_DIR/spa.traineddata" "$TESSDATA_URL"
          echo "$TESSDATA_SHA256  $TESSDATA_DIR/spa.traineddata" | sha256sum -c -

      - name: Dependencias del generador
        working-directory: tools/dataset-generator
        run: pip install -r requirements.txt

      # Una corrida de ajuste ([ajuste-ocr]) usa SOLO el banco de desarrollo: el de evaluación no se toca.
      - name: Banco de evaluación (seed 2026)
        if: ${{ !contains(github.event.head_commit.message, '[ajuste-ocr]') }}
        working-directory: tools/dataset-generator
        run: python generate.py --seed 2026 --out data/

      - name: Banco de desarrollo (seed 7, solo para ajuste)
        if: contains(github.event.head_commit.message, '[ajuste-ocr]')
        working-directory: tools/dataset-generator
        run: python generate.py --seed 7 --out data-dev/

      - name: Diagnóstico de Tesseract (banco de desarrollo)
        if: contains(github.event.head_commit.message, '[ajuste-ocr]')
        run: |
          img=tools/dataset-generator/data-dev/vouchers/0001.jpg
          tesseract "$img" stdout -l spa --psm 6 --tessdata-dir "$TESSDATA_DIR" -c tessedit_create_tsv=1 > diag_archivo.txt 2>&1 || true
          tesseract stdin stdout -l spa --psm 6 --tessdata-dir "$TESSDATA_DIR" -c tessedit_create_tsv=1 < "$img" > diag_stdin.txt 2>&1 || true
          head -12 diag_archivo.txt > a.txt; head -12 diag_stdin.txt > b.txt
          python3 .github/scripts/csv_anotacion.py a.txt "Tesseract con archivo"
          python3 .github/scripts/csv_anotacion.py b.txt "Tesseract con stdin"

      - name: Build
        run: dotnet build tests/Reclamos.Infrastructure.Tests

      - name: Integración OCR (10 vouchers, reporta sin umbrales)
        if: ${{ !contains(github.event.head_commit.message, '[ajuste-ocr]') }}
        run: >
          dotnet test --project tests/Reclamos.Infrastructure.Tests --no-build --report-trx
          --results-directory "${{ github.workspace }}/TestResults" --filter-trait "Categoria=Integracion"

      - name: Ajuste del preprocesamiento (banco de desarrollo)
        if: contains(github.event.head_commit.message, '[ajuste-ocr]')
        run: >
          dotnet test --project tests/Reclamos.Infrastructure.Tests --no-build --report-trx
          --results-directory "${{ github.workspace }}/TestResults" --filter-trait "Categoria=AjusteOcr"

      - name: Publicar reportes como anotaciones
        if: always()
        run: |
          if [ -f TestResults/ocr/ocr_integracion.csv ]; then
            python3 .github/scripts/csv_anotacion.py TestResults/ocr/ocr_integracion.csv "OCR integración - seed 2026 - 10 vouchers"
          fi
          if [ -f TestResults/ocr/ocr_ajuste_dev.csv ]; then
            python3 .github/scripts/csv_anotacion.py TestResults/ocr/ocr_ajuste_dev.csv "Ajuste OCR - banco de desarrollo seed 7"
          fi
          python3 .github/scripts/trx_anotaciones.py TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ocr
          path: TestResults

  rag:
    name: RAG (Pinecone + embeddings)
    runs-on: ubuntu-24.04
    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      RAG_REPORTES_DIR: ${{ github.workspace }}/TestResults/rag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: |
          dotnet build src/Reclamos.Indexador
          dotnet build tests/Reclamos.Infrastructure.Tests

      - name: Estado de los secrets (solo si existen, nunca su valor)
        run: |
          echo "::notice title=Secrets RAG::PINECONE_API_KEY=$([ -n "$PINECONE_API_KEY" ] && echo configurada || echo FALTA) EMBEDDING_API_KEY=$([ -n "$EMBEDDING_API_KEY" ] && echo configurada || echo FALTA)"

      # La indexación modifica Pinecone: solo con la etiqueta [indexar-pinecone] en el mensaje del commit.
      - name: Indexar corpus normativo
        if: contains(github.event.head_commit.message, '[indexar-pinecone]')
        run: dotnet run --project src/Reclamos.Indexador --no-build

      - name: Integración RAG (3 consultas, reporta sin umbrales)
        run: >
          dotnet test --project tests/Reclamos.Infrastructure.Tests --no-build --report-trx
          --results-directory "${{ github.workspace }}/TestResults" --filter-trait "Categoria=IntegracionRag"

      # Revisión de θ con consultas de desarrollo: solo con la etiqueta [calibrar-theta].
      - name: Calibración de θ (consultas de desarrollo, reporta sin decidir)
        if: contains(github.event.head_commit.message, '[calibrar-theta]')
        run: >
          dotnet test --project tests/Reclamos.Infrastructure.Tests --no-build --report-trx
          --results-directory "${{ github.workspace }}/TestResults" --filter-trait "Categoria=CalibracionRag"

      - name: Publicar reportes como anotaciones
        if: always()
        run: |
          for f in calibracion_theta calibracion_theta_top5; do
            if [ -f TestResults/rag/$f.csv ]; then
              python3 .github/scripts/csv_anotacion.py TestResults/rag/$f.csv "RAG $f"
            fi
          done
          if [ -f TestResults/rag/rag_integracion.csv ]; then
            python3 .github/scripts/csv_anotacion.py TestResults/rag/rag_integracion.csv "RAG integración - 3 consultas"
          fi
          python3 .github/scripts/trx_anotaciones.py TestResults

  knowledge:
    name: Corpus normativo (reproducibilidad)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/knowledge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt

      # Si un portal oficial no responde desde el runner, la prueba de reproducción se omite (no falla).
      - name: Descargar PDF oficiales (SHA-256 fijado)
        continue-on-error: true
        run: python fragmentar.py --descargar

      - name: Tests (incluye regenerar el corpus y comparar su SHA-256)
        run: python -m pytest -q -rs

  python:
    name: Python (generador del banco)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/dataset-generator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y unixodbc
          pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q
