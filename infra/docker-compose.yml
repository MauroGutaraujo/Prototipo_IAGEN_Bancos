# Entorno sandbox local. Uso: docker compose -f infra/docker-compose.yml --env-file .env up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reclamos-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # API (H6): Tesseract y el modelo spa verificado por SHA-256 dentro de la imagen.
  # Las claves (PINECONE_API_KEY, GEMINI_API_KEY) se leen de ../.env; los vouchers se montan de solo lectura.
  api:
    build: { context: .., dockerfile: src/Reclamos.Api/Dockerfile }
    env_file: ../.env
    environment:
      SQL_CONN: "Server=sqlserver,1433;Database=ReclamosTesis;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    volumes:
      - ../tools/dataset-generator/data:/datos:ro
    depends_on: { sqlserver: { condition: service_healthy } }
    ports: ["8080:8080"]

volumes:
  sqldata:
